name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://127.0.0.1:3101

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t milkgraph-frontend:ci .

      - name: Run container & smoke test
        run: |
          docker run -d --name smoke-test -p 127.0.0.1:3101:3000 milkgraph-frontend:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' smoke-test)" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke-test)" = healthy
          node tests/deployment.mjs
          test "$(docker exec smoke-test id -u)" != 0
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke-test)" = healthy
          echo 'PASS: container healthy, non-root'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke-test || true

      - name: Cleanup container
        if: always()
        run: docker rm -f smoke-test || true
